# Pages CMS configuration for the Yi Xing website (https://pagescms.org/docs/configuration/)
# Every save is a commit to this repository; GitHub Pages republishes the site about a minute later.

media:
  input: media
  output: media

content:
  # ---------------------------------------------------------------- campaigns
  - name: campaigns
    label: Campaigns
    description: The home page for a season. The live campaign whose dates include today is shown.
    type: collection
    subfolders: false
    path: _data/campaigns
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, active, start, end]
      primary: title
    fields:
      - name: title
        label: Campaign name
        type: string
        required: true
      - name: slug
        label: Short name for the file
        description: Lowercase letters, numbers and hyphens, for example cny-2027.
        type: string
        required: true
      - name: active
        label: Live on the site
        description: The home page shows the live campaign whose dates include today. If two overlap, the one that starts later wins.
        type: boolean
        default: false
      - name: start
        label: Starts
        type: date
      - name: end
        label: Ends
        type: date
      - name: announcements
        label: Announcement bar messages (shown one at a time)
        type: object
        list:
          collapsible: { collapsed: true, summary: "{fields.text}" }
        fields:
          - { name: text, label: Message, type: string }
          - { name: link_label, label: Link text, type: string }
          - name: link
            label: Link
            description: "#brochure-<name>, #collection-<name>, #story-<name>, #product-<ref>, #enquiry-appointment, whatsapp, or a full https:// address."
            type: string
      - name: hero
        label: Home page banner
        type: object
        fields:
          - name: media
            label: Banner type
            type: select
            options:
              values: [video, image]
          - name: video
            label: Video
            description: MP4, 1920 × 1080, 8 to 12 seconds, no sound, under 10 MB. Keep the jewellery in the middle-right of the frame.
            type: file
            options:
              path: media/uploads/videos
              extensions: [mp4, webm]
          - name: image
            label: Image (also shown while the video loads)
            description: JPG or WebP, 1920 × 1080, under 600 KB.
            type: image
            options:
              path: media/uploads/images
          - name: mobile_image
            label: Phone image (optional)
            description: Portrait, 1080 × 1350. Leave empty to crop the banner.
            type: image
            options:
              path: media/uploads/images
          - { name: title, label: Headline, type: string }
          - { name: subtitle, label: Line under the headline, type: string }
          - { name: button_label, label: Button text, type: string }
          - { name: button_link, label: Button link, type: string, description: "Same link options as the announcement bar." }
          - name: text
            label: Text colour
            description: Light for dark images, dark for bright ones.
            type: select
            options:
              values: [light, dark]
          - name: focus
            label: On phones, keep this side in view
            type: select
            options:
              values: [left, centre, right]
      - name: products
        label: Product carousel
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - name: items
            label: Products, in order
            type: reference
            options:
              collection: products
              multiple: true
              value: "{fields.id}"
              label: "{fields.name} ({fields.id})"
              search: "primary,name"
      - name: promos
        label: Three promo tiles
        type: object
        list:
          max: 3
          collapsible: { collapsed: true, summary: "{fields.title}" }
        fields:
          - name: image
            label: Image
            description: Landscape, about 1400 × 1000.
            type: image
            options:
              path: media/uploads/images
          - { name: title, label: Title, type: string }
          - { name: link_label, label: Link text, type: string }
          - { name: link, label: Link, type: string }
      - name: editorial
        label: Editorial feature
        type: object
        fields:
          - name: story
            label: Story
            type: reference
            options:
              collection: editorial
              value: "{fields.slug}"
              label: "{fields.title}"
              search: "primary,name"
          - { name: title, label: Heading (empty uses the story title), type: string }
          - { name: text, label: Short text, type: text }
          - { name: link_label, label: Link text, type: string }
          - name: image
            label: Image (empty uses the story image)
            type: image
            options:
              path: media/uploads/images

  # ---------------------------------------------------------------- products
  - name: products
    label: Products
    description: Every piece on the site, with its images and video.
    type: collection
    subfolders: false
    path: _data/products
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [name, id, collection, show]
      primary: name
    fields:
      - name: id
        label: Reference
        description: Your product code, for example 3945 or P3843-A.
        type: string
        required: true
      - { name: name, label: Name, type: string, required: true }
      - name: collection
        label: Collection
        type: reference
        options:
          collection: collections
          value: "{fields.id}"
          label: "{fields.name}"
          search: "primary,name"
      - name: kind
        label: Type
        type: select
        options:
          values: [Bracelet, Charm, Necklace, Pendant, Bangle, Ring, Earrings]
      - name: images
        label: Images
        description: The first image is used on cards. Portrait 4:5, 1200 × 1500, under 400 KB each.
        type: image
        options:
          multiple:
            max: 8
          path: media/uploads/products
      - name: video
        label: Video (optional)
        description: MP4, under 10 MB. Plays in the product window.
        type: file
        options:
          path: media/uploads/videos
          extensions: [mp4, webm]
      - { name: description, label: Description, type: text }
      - { name: parts, label: "Made of (one bead, pipe or part per line)", type: string, list: true }
      - { name: gold, label: Gold, description: "For example Yellow 916 gold (1C).", type: string }
      - { name: weight, label: Weight, description: "For example 2.05 g. Leave empty to show Weighed at the counter.", type: string }
      - { name: price, label: Price line (optional), description: "Leave empty to show Priced by weight.", type: string }
      - { name: order, label: Order, description: Lower numbers come first., type: number }
      - { name: show, label: Show on the site, type: boolean, default: true }

  # ---------------------------------------------------------------- collections
  - name: collections
    label: Collections
    description: The collection names and the tiles under Shop by collection.
    type: collection
    subfolders: false
    path: _data/collections
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [name, id, order, show_on_home]
      primary: name
    fields:
      - { name: id, label: Short name, description: "Lowercase, for example colonne. Used in links as #collection-colonne.", type: string, required: true }
      - { name: name, label: Name, type: string, required: true }
      - { name: idea, label: One-line idea, type: string }
      - { name: text, label: Description, type: text }
      - name: image
        label: Tile image
        description: Square, 1000 × 1000.
        type: image
        options:
          path: media/uploads/images
      - { name: order, label: Order, type: number }
      - { name: show_on_home, label: Show in Shop by collection, type: boolean, default: true }

  # ---------------------------------------------------------------- editorial
  - name: editorial
    label: Editorial
    description: Stories under Highlights → Editorial.
    type: collection
    subfolders: false
    path: _data/editorial
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, category, date, show]
      primary: title
    fields:
      - name: title
        label: Title
        description: Put a word between *asterisks* to set it in italic gold.
        type: string
        required: true
      - { name: slug, label: Short name, description: "Lowercase and hyphens. The story's link becomes #story-<short name>.", type: string, required: true }
      - name: category
        label: Category
        type: select
        options:
          values: [Craft, Collections, Guides, Gifting]
      - { name: read, label: Minutes to read, type: number }
      - { name: date, label: Date, type: date }
      - name: hero
        label: Main image
        description: Landscape, 1600 × 1000.
        type: image
        options:
          path: media/uploads/images
      - { name: hero_alt, label: Describe the main image, type: string }
      - { name: dek, label: Summary, type: text }
      - { name: order, label: Order, description: "1 is the featured story.", type: number }
      - { name: show, label: Show on the site, type: boolean, default: true }
      - name: body
        label: Story (blocks in reading order; drag to reorder)
        type: block
        list:
          collapsible: { collapsed: true, summary: "{index}. {fields.type} {fields.text}{fields.title}{fields.caption}{fields.name}" }
        blockKey: type
        blocks:
          - name: heading
            label: Heading
            fields:
              - { name: text, label: Heading, type: string }
          - name: text
            label: Text
            fields:
              - { name: html, label: Text, type: rich-text, options: { format: html } }
          - name: image
            label: Image
            fields:
              - name: image
                label: Image
                type: image
                options:
                  path: media/uploads/images
              - { name: alt, label: Describe the image, type: string }
              - { name: caption, label: Caption, type: string }
          - name: quote
            label: Quote
            fields:
              - { name: text, label: Quote, type: text }
          - name: products
            label: Products
            fields:
              - { name: title, label: Heading, type: string }
              - name: items
                label: Products
                type: reference
                options:
                  collection: products
                  multiple: true
                  value: "{fields.id}"
                  label: "{fields.name} ({fields.id})"
                  search: "primary,name"
          - name: component
            label: Built-in section
            fields:
              - name: name
                label: Built-in section
                type: select
                options:
                  values: [library, colours, steps]
          - name: buttons
            label: Buttons
            fields:
              - name: items
                label: Buttons
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{fields.label}" }
                fields:
                  - { name: label, label: Button text, type: string }
                  - { name: link, label: Link, type: string }
                  - name: style
                    label: Style
                    type: select
                    options:
                      values: [solid, line]

  # ---------------------------------------------------------------- e-brochures
  - name: brochures
    label: e-Brochures
    description: Brochures made from page images. They appear on the shelf before the designed ones.
    type: collection
    subfolders: false
    path: _data/brochures
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, order, show]
      primary: title
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Short name, description: "Lowercase and hyphens. Link to it with #brochure-<short name>.", type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string }
      - name: cover
        label: Cover
        description: Portrait 4:5, 1600 × 2000. Export each page of your brochure as a JPG at this size.
        type: image
        options:
          path: media/uploads/brochures
      - name: pages
        label: Pages, in order
        type: object
        list:
          collapsible: { collapsed: true, summary: "Page {index} {fields.caption}" }
        fields:
          - name: image
            label: Page image
            description: Portrait 4:5, 1600 × 2000, under 600 KB.
            type: image
            options:
              path: media/uploads/brochures
          - { name: caption, label: Caption (optional), type: string }
          - name: product
            label: Product on this page (optional)
            description: Adds a View the design button.
            type: reference
            options:
              collection: products
              value: "{fields.id}"
              label: "{fields.name} ({fields.id})"
              search: "primary,name"
      - { name: order, label: Order on the shelf, description: Lower numbers come first., type: number }
      - { name: show, label: Show on the site, type: boolean, default: true }

  # ---------------------------------------------------------------- home page
  - name: home
    label: Home page
    type: file
    path: _data/home.json
    format: json
    fields:
      - name: hero
        label: Banner when no campaign is live
        type: object
        fields:
          - name: media
            label: Banner type
            type: select
            options:
              values: [video, image]
          - name: video
            label: Video
            type: file
            options:
              path: media/uploads/videos
              extensions: [mp4, webm]
          - name: image
            label: Image
            type: image
            options:
              path: media/uploads/images
          - name: mobile_image
            label: Phone image (optional)
            type: image
            options:
              path: media/uploads/images
          - { name: title, label: Headline, type: string }
          - { name: subtitle, label: Line under the headline, type: string }
          - { name: button_label, label: Button text, type: string }
          - { name: button_link, label: Button link, type: string }
          - name: text
            label: Text colour
            type: select
            options:
              values: [light, dark]
          - name: focus
            label: On phones, keep this side in view
            type: select
            options:
              values: [left, centre, right]
      - name: announcements
        label: Announcement bar when no campaign is live
        type: object
        list:
          collapsible: { collapsed: true, summary: "{fields.text}" }
        fields:
          - { name: text, label: Message, type: string }
          - { name: link_label, label: Link text, type: string }
          - { name: link, label: Link, type: string }
      - { name: collections_title, label: Collections heading, type: string }
      - name: appointment
        label: Book an appointment
        type: object
        fields:
          - name: image
            label: Image
            description: Portrait, about 1080 × 1350.
            type: image
            options:
              path: media/uploads/images
          - { name: title, label: Heading, type: string }
          - { name: text, label: Text, type: text }
          - { name: button_label, label: Button text, type: string }
          - { name: button_link, label: Button link, type: string }
      - { name: experience_title, label: Services heading, type: string }
      - name: experience
        label: Services row
        type: object
        list:
          max: 4
          collapsible: { collapsed: true, summary: "{fields.title}" }
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values: [scale, ruler, gift, chat, calendar, sparkle]
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: link_label, label: Link text, type: string }
          - { name: link, label: Link, type: string }
      - name: builtin_brochures
        label: Designed brochures to show
        description: The four brochures built into the site. Brochures you add under e-Brochures are shown first.
        type: select
        options:
          multiple: true
          values: [christmas, collection, gift, library]
